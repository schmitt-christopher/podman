name: Certificate path tests

on:
  push:
    branches:
      - test/certificate-import
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificates:
    name: Certificate regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ac1d5b9524bb07eba7fdc844c027e3ae1102726b
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test certificate import paths
        env:
          CGO_ENABLED: "0"
        run: go test -mod=vendor -tags 'remote containers_image_openpgp' ./pkg/machine/certificates -count=1 -v

  validate:
    name: Full repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ac1d5b9524bb07eba7fdc844c027e3ae1102726b
          fetch-depth: 0
          persist-credentials: false
      - name: Provide the main reference used by validation
        run: git branch main HEAD^
      - name: Build and validate in the official container
        run: |
          docker run --rm --init --tmpfs /tmp \
            --volume "$PWD:/go/src/github.com/containers/podman" \
            --volume validatepr-gocache:/root/.cache/go-build \
            --volume validatepr-gomodcache:/root/go/pkg/mod \
            --volume validatepr-lintcache:/root/.cache/golangci-lint \
            --volume validatepr-precommitcache:/root/.cache/pre-commit \
            --security-opt label=disable --network=host \
            --workdir /go/src/github.com/containers/podman \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/go/src/github.com/containers/podman \
            quay.io/libpod/validatepr:latest sh -ec '
              dnf -y install "perl(Test::Differences)"
              exec make .validatepr
            '
